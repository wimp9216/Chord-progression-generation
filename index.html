<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chord Canvas — Melody Studio</title><link rel="stylesheet" href="./style.css?v=6"></head>
<body><main>
<header><span class="badge">CHORD CANVAS</span><h1>Melody Studio</h1><p>録音したメロディを編集して、コードを重ねる。</p></header>
<section class="import-panel" aria-label="音声入力"><div class="actions"><button id="record">● 録音を開始</button><button id="record-stop" disabled>■ 録音を終了</button><label class="file-label">音声ファイル<input id="audio-file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm"></label><button id="analyze" class="primary">メロディから候補を生成</button></div>
<audio id="melody-preview" controls hidden></audio><p id="melody-status" role="status" aria-live="polite">音声機能を準備しています。この表示が続く場合はページを再読み込みしてください。</p></section>
<section class="studio" aria-label="ピアノロール・ワークスペース"><section id="piano-roll" aria-label="メロディ編集"></section></section>
<section class="candidate-panel" aria-label="コード候補"><div class="result-heading"><h2>コード進行の候補</h2><button id="copy" disabled>選択した進行をコピー</button></div><p id="summary">音声の解析待ち</p><div id="candidates"></div><p id="status" role="status" aria-live="polite"></p></section>
<footer>音声はブラウザ内で処理 · 単音メロディ向け · 最大60秒／20MB · キーとテンポは自動推定</footer>
</main><script type="module" src="./app.js?v=6" onerror="document.getElementById('melody-status').textContent='音声機能を読み込めませんでした。ページを再読み込みしてください。'"></script></body></html>
